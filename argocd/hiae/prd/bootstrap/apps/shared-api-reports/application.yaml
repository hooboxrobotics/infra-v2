apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-api-reports
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/hooboxrobotics/infra-v2.git
    targetRevision: main
    path: argocd/hiae/prd/manifests/apps/shared-api-reports
  destination:
    server: https://kubernetes.default.svc
    namespace: shared-api-reports
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
