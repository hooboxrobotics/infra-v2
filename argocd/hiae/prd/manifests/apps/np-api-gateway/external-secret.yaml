apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: np-api-gateway
  namespace: apps-np-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameterstore
    kind: ClusterSecretStore
  target:
    name: np-api-gateway
    creationPolicy: Owner
  dataFrom:
    # import everthing inside the SSM Paramter Path bellow
    - find:
        path: /kubernetes/hbx-prd/np-api-gateway
        name:
          regexp: ".*"
        nullBytePolicy: Ignore
        conversionStrategy: Default
        decodingStrategy: None
      rewrite:
        # Everything tht matches with (.*) will be turned into
        # a data entry inside the secret.
        #
        # An example, the path /kubernetes/hbx-prd/np-api-gateway/DATABASE_URL
        # will become the DATABASE_URL entry.
        - regexp:
            source: "/kubernetes/hbx-prd/np-api-gateway/(.*)"
            target: "$1"
