logger:
  level: ALL

http:
  enabled: true
  root_path: /benthos
  debug_endpoints: true

input:
  label: input
  broker:
    inputs:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/np_api_tickets?${INPUT_CONNOPTS}
          query: |
            SELECT
              SUM(CASE WHEN TU.comment like "[SYSTEM] Expired -%" THEN 1 ELSE 0 END) AS expired,
              SUM(CASE WHEN TU.comment like "[SYSTEM] Finished%" THEN 1 ELSE 0 END) AS finished,
              DATE_FORMAT(TU.datetime, '%Y-%m-%d %H:00:00') AS start,
              DATE_ADD(DATE_FORMAT(TU.datetime, '%Y-%m-%d %H:00:00'), INTERVAL 3599 SECOND) AS end,
              T.id_company as company_id
            FROM np_api_tickets.ticketusages TU
            JOIN np_api_tickets.tickets T ON T.ticket_id = TU.ticket_id
            WHERE
              TU.datetime >= COALESCE(
                  (SELECT DT.reference_date FROM benthos.datatracker DT WHERE DT.source = 'expired_and_finished_tickets'),
                  '2000-01-01 00:00:00'
              )
              AND (
                TU.comment like "[SYSTEM] Expired -%"
                OR TU.comment like "[SYSTEM] Finished%"
              )
            GROUP BY
              DATE_FORMAT(TU.datetime, '%Y-%m-%d %H:00:00'),
              DATE_ADD(DATE_FORMAT(TU.datetime, '%Y-%m-%d %H:00:00'), INTERVAL 3599 SECOND),
              T.id_company
            ORDER BY
              DATE_FORMAT(TU.datetime, '%Y-%m-%d %H:00:00'),
              DATE_ADD(DATE_FORMAT(TU.datetime, '%Y-%m-%d %H:00:00'), INTERVAL 3599 SECOND),
              T.id_company,
              SUM(CASE WHEN TU.comment like "[SYSTEM] Expired -%" THEN 1 ELSE 0 END),
              SUM(CASE WHEN TU.comment like "[SYSTEM] Finished%" THEN 1 ELSE 0 END);
    batching:
      count: 10000
      period: 20s

pipeline:
  processors:
  - label: processor_generate_expired_and_finished_ticket_id
    bloblang: |
      root = this
      root.expired_and_finished_ticket_id = "%s%s".format(this.start, this.company_id)
      root.expired_and_finished_ticket_id = root.expired_and_finished_ticket_id.hash("md5").encode("hex")

  - label: processor_get_headquarter_information
    branch:
      request_map: root = this
      result_map: |
        if this.length() > 0 && this.0.id_headquarters != NULL {
          root.headquarters_id = this.0.id_headquarters
        }
      processors:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_contracts?${INPUT_CONNOPTS}
          query: |
            SELECT
              c.id_headquarters
            FROM shared_api_contracts.companies c
            WHERE c.id_company = ?;
          args_mapping: '[ this.company_id ]'

output:
  broker:
    pattern: fan_out
    outputs:
    - label: output_saving_enriched_data
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${OUTPUT_USERNAME}:${OUTPUT_PASSWORD}@tcp(${OUTPUT_CONNHOST}:${OUTPUT_CONNPORT})/${OUTPUT_DATABASE}?${OUTPUT_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS expiredandfinishedtickets (
            expired_and_finished_ticket_id  CHAR(36)      NOT NULL  PRIMARY KEY,
            expired                         INTEGER       NOT NULL,
            finished                        INTEGER       NOT NULL,
            start                           TIMESTAMP     NOT NULL,
            end                             TIMESTAMP     NOT NULL,
            company_id                      CHAR(36)      NOT NULL,
            headquarters_id                 CHAR(36)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE utf8mb4_unicode_ci;
        query:
          INSERT INTO expiredandfinishedtickets (
            expired_and_finished_ticket_id,
            expired,
            finished,
            start,
            end,
            company_id,
            headquarters_id
          ) VALUES (?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
            expired           = COALESCE(VALUES(expired), expired),
            finished          = COALESCE(VALUES(finished), finished),
            start             = COALESCE(VALUES(start), start),
            end               = COALESCE(VALUES(end), end),
            company_id        = COALESCE(VALUES(company_id), company_id),
            headquarters_id   = COALESCE(VALUES(headquarters_id), headquarters_id);
        args_mapping: |
          root = [
            this.expired_and_finished_ticket_id,
            this.expired,
            this.finished,
            this.start,
            this.end,
            this.company_id,
            this.headquarters_id
          ]

    - label: output_set_reference_date
      processors:
        - mapping: |
            root = if batch_index() != batch_size() - 1 { deleted() }
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${MAIN_USERNAME}:${MAIN_PASSWORD}@tcp(${MAIN_CONNHOST}:${MAIN_CONNPORT})/benthos?${MAIN_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS datatracker (
            source				    VARCHAR(255)  NOT NULL  PRIMARY KEY,
            reference_date		DATETIME      NOT NULL
          );
        query: |
          INSERT INTO datatracker (source, reference_date)
          VALUES ('expired_and_finished_tickets', ?)
          ON DUPLICATE KEY UPDATE reference_date = VALUES(reference_date);
        args_mapping: root = [ this.start ]
