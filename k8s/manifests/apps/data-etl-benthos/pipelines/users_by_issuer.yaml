logger:
  level: ALL

http:
  enabled: true
  root_path: /benthos
  debug_endpoints: true

input:
  label: input
  broker:
    inputs:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_users?${INPUT_CONNOPTS}
          query: |
            SELECT
              UPPER(Issuer.fullname) AS issuer,
              COUNT(0) AS total_per_hour,
              DATE_FORMAT(U.creationDate, '%Y-%m-%d %H:00:00') as start,
              DATE_ADD(DATE_FORMAT(U.creationDate, '%Y-%m-%d %H:00:00'), INTERVAL 3599 SECOND) as end,
              U.id_company AS company_id
            FROM
              shared_api_users.users U
            JOIN
              shared_api_users.users Issuer ON Issuer.id_user = U.created_by
            WHERE
              DATE_FORMAT(U.creationDate, '%Y-%m-%d %H:00:00') >= COALESCE(
                  (SELECT DT.reference_date FROM benthos.datatracker DT WHERE DT.source = 'users_by_issuer'),
                  '2000-01-01 00:00:00'
              )
            GROUP BY
              Issuer.fullname,
              DATE_FORMAT(U.creationDate, '%Y-%m-%d %H:00:00'),
              DATE_ADD(DATE_FORMAT(U.creationDate, '%Y-%m-%d %H:00:00'), INTERVAL 3599 SECOND),
              U.id_company
            ORDER BY
              DATE_FORMAT(U.creationDate, '%Y-%m-%d %H:00:00');
    batching:
      count: 10000
      period: 20s
      

pipeline:
  processors:
  - label: processor_generate_users_by_issuer_id
    bloblang: |
      root = this
      root.users_by_issuer_id = "%s%s%s".format(this.start, this.issuer, this.company_id)
      root.users_by_issuer_id = root.users_by_issuer_id.hash("md5").encode("hex")

  - label: processor_get_headquarter_information
    branch:
      request_map: root = this
      result_map: |
        if this.length() > 0 && this.0.id_headquarters != NULL {
          root.headquarters_id = this.0.id_headquarters
        }
      processors:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_contracts?${INPUT_CONNOPTS}
          query: |
            SELECT
              c.id_headquarters
            FROM shared_api_contracts.companies c
            WHERE c.id_company = ?;
          args_mapping: '[ this.company_id ]'

output:
  broker:
    pattern: fan_out
    outputs:
    - label: output_saving_enriched_data
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${OUTPUT_USERNAME}:${OUTPUT_PASSWORD}@tcp(${OUTPUT_CONNHOST}:${OUTPUT_CONNPORT})/${OUTPUT_DATABASE}?${OUTPUT_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS usersbyissuer (
            users_by_issuer_id    CHAR(36)      NOT NULL  PRIMARY KEY,
            start                 TIMESTAMP     NOT NULL,
            end                   TIMESTAMP     NOT NULL,
            issuer                VARCHAR(255)  NOT NULL,
            total_per_hour        INT           NOT NULL,
            company_id            CHAR(36)      NOT NULL,
            headquarters_id       CHAR(36)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE utf8mb4_unicode_ci;
        query: |
          INSERT INTO usersbyissuer (
            users_by_issuer_id, start, end, issuer, total_per_hour, company_id, headquarters_id
          ) VALUES (?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
            start = COALESCE(VALUES(start), start),
            end = COALESCE(VALUES(end), end),
            issuer = COALESCE(VALUES(issuer), issuer),
            total_per_hour = COALESCE(VALUES(total_per_hour), total_per_hour),
            company_id = COALESCE(VALUES(company_id), company_id),
            headquarters_id = COALESCE(VALUES(headquarters_id), headquarters_id);
        args_mapping: |
          root = [
            this.users_by_issuer_id,
            this.start,
            this.end,
            this.issuer,
            this.total_per_hour,
            this.company_id,
            this.headquarters_id
          ]
    
    - label: output_set_reference_date
      processors:
        - mapping: |
            root = if batch_index() != batch_size() - 1 { deleted() }
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${MAIN_USERNAME}:${MAIN_PASSWORD}@tcp(${MAIN_CONNHOST}:${MAIN_CONNPORT})/benthos?${MAIN_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS datatracker (
            source				    VARCHAR(255)  NOT NULL  PRIMARY KEY,
            reference_date		DATETIME      NOT NULL
          );
        query: |
          INSERT INTO datatracker (source, reference_date)
          VALUES ('users_by_issuer', ?)
          ON DUPLICATE KEY UPDATE reference_date = VALUES(reference_date);
        args_mapping: root = [ this.start ]
