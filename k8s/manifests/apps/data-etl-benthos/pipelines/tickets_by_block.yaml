logger:
  level: ALL

http:
  enabled: true
  root_path: /benthos
  debug_endpoints: true

input:
  label: input
  broker:
    inputs:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/np_api_tickets?${INPUT_CONNOPTS}
          query: |
            WITH TicketData AS (
              SELECT
                DATE_FORMAT(T.created_at, '%Y-%m-%d %H:00:00') AS start,
                TIMESTAMPADD(SECOND, 3599, DATE_FORMAT(T.created_at, '%Y-%m-%d %H:00:00')) AS end,
                COALESCE(UPPER(JSON_VALUE(T.additionals, '$.reception_type')), UPPER(P1.name), UPPER(P2.name), 'NÃO INFORMADO') AS block,
                COALESCE(UPPER(JSON_VALUE(T.additionals, '$.reason')), 'NÃO INFORMADO') AS reason,
                T.id_company
              FROM np_api_tickets.tickets T
              LEFT JOIN shared_api_contracts.places P1 ON P1.id_place = JSON_VALUE(T.additionals, '$.reception_id')
              LEFT JOIN shared_api_contracts.places P2 ON P2.id_place = T.place_id
              WHERE T.created_at >= COALESCE(
                (SELECT DT.reference_date FROM benthos.datatracker DT WHERE DT.source = 'tickets_by_block'),
                '2000-01-01 00:00:00'
              )
            )
            SELECT 
              start,
              end,
              block,
              reason,
              COUNT(*) AS total_per_hour,
              id_company AS company_id
            FROM TicketData
            GROUP BY start, end, block, reason, id_company
            ORDER BY start;
    batching:
      count: 10000
      period: 20s      

pipeline:
  processors:
  - label: processor_generate_ticket_by_block_id
    bloblang: |
      root = this
      root.ticket_by_block_id = "%s%s%s%s".format(this.start, this.block, this.reason, this.company_id)
      root.ticket_by_block_id = root.ticket_by_block_id.hash("md5").encode("hex")

  - label: processor_get_headquarter_information
    branch:
      request_map: root = this
      result_map: |
        if this.length() > 0 && this.0.id_headquarters != NULL {
          root.headquarters_id = this.0.id_headquarters
        }
      processors:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_contracts?${INPUT_CONNOPTS}
          query: |
            SELECT
              c.id_headquarters
            FROM shared_api_contracts.companies c
            WHERE c.id_company = ?;
          args_mapping: '[ this.company_id ]'

output:
  broker:
    pattern: fan_out
    outputs:
    - label: output_saving_enriched_data
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${OUTPUT_USERNAME}:${OUTPUT_PASSWORD}@tcp(${OUTPUT_CONNHOST}:${OUTPUT_CONNPORT})/${OUTPUT_DATABASE}?${OUTPUT_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS ticketsbyblock (
            ticket_by_block_id  CHAR(36)      NOT NULL  PRIMARY KEY,
            start               TIMESTAMP     NOT NULL,
            end                 TIMESTAMP     NOT NULL,
            block               VARCHAR(255),
            reason              VARCHAR(255),
            total_per_hour      INT           NOT NULL,
            company_id          CHAR(36)      NOT NULL,
            headquarters_id     CHAR(36)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE utf8mb4_unicode_ci;
        query: |
          INSERT INTO ticketsbyblock (
            ticket_by_block_id, start, end, block, reason, total_per_hour, company_id, headquarters_id
          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
            start = VALUES(start),
            end = VALUES(end),
            block = COALESCE(VALUES(block), block),
            reason = COALESCE(VALUES(reason), reason),
            total_per_hour = VALUES(total_per_hour),
            company_id = VALUES(company_id),
            headquarters_id = COALESCE(VALUES(headquarters_id), headquarters_id);
        args_mapping: |
          root = [
            this.ticket_by_block_id,
            this.start,
            this.end,
            this.block,
            this.reason,
            this.total_per_hour,
            this.company_id,
            this.headquarters_id
          ]
 
    - label: output_set_reference_date
      processors:
        - mapping: |
            root = if batch_index() != batch_size() - 1 { deleted() }
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${MAIN_USERNAME}:${MAIN_PASSWORD}@tcp(${MAIN_CONNHOST}:${MAIN_CONNPORT})/benthos?${MAIN_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS datatracker (
            source				    VARCHAR(255)  NOT NULL  PRIMARY KEY,
            reference_date		DATETIME      NOT NULL
          );
        query: |
          INSERT INTO datatracker (source, reference_date)
          VALUES ('tickets_by_block', ?)
          ON DUPLICATE KEY UPDATE reference_date = VALUES(reference_date);
        args_mapping: root = [ this.start ]
