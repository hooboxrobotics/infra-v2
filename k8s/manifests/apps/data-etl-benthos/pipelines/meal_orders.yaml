logger:
  level: DEBUG

http:
  enabled: true
  root_path: /benthos
  debug_endpoints: true

input:
  label: input
  broker:
    inputs:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_or_events?${INPUT_CONNOPTS}
          query: |
            WITH BenthosReference AS (
              SELECT
                COALESCE(MAX(d.reference_date), '2000-01-01 00:00:00') AS reference_date
              FROM benthos.datatracker d
              WHERE d.source = 'meal_orders'
            ),
            PedidosPayments AS (
              SELECT
                p.id AS id_pedido,
                p.created_at,
                rf.descricao,
                pr.gratuito,
                pr.id AS id_pedido_refeicao,
                rf.valor_centavos,
                jt.answer AS delivery_place,
                pg.tipo_pagamento AS payment_method,
                pg.status AS payment_status,
                pg.bandeira_cartao AS brand,
                pg.id_transacao AS cv,
                c.nome AS name,
                c.numero_documento AS document,
                p.delivery_date,
                s.name AS order_status,
                os.created_at AS modified_at
              FROM shared_api_payments.pedidos p
              JOIN shared_api_payments.pedidorefeicoes pr 
                ON pr.id_pedido = p.id  
              JOIN shared_api_payments.refeicaoforms rf 
                ON rf.id = pr.id_refeicao_form
              JOIN shared_api_reports.orders o
                ON o.order_id = p.id
              JOIN shared_api_reports.orderstatuses os
                ON os.order_id = o.order_id
              JOIN shared_api_reports.statuses s
                ON s.status_id = os.status_id 
              JOIN shared_api_payments.pagamentos pg
                ON pg.id_pedido = p.id
              JOIN shared_api_payments.clientes c
                ON c.hash_documento = p.documento
              JOIN BenthosReference br
              LEFT JOIN JSON_TABLE(
                o.content,
                '$[*]' COLUMNS (
                  question VARCHAR(255) PATH '$.question',
                  answer   VARCHAR(255) PATH '$.answer'
                )
              ) jt
                ON jt.question = 'LOCAL DE ENTREGA'
              WHERE os.created_at >= br.reference_date
            )
            SELECT
              id_pedido,
              id_pedido_refeicao,
              created_at,
              descricao,
              delivery_place,
              payment_method,
              payment_status,
              brand,
              cv,
              name,
              document,
              delivery_date,
              order_status,
              modified_at,
              CASE 
                WHEN gratuito = 0 THEN valor_centavos 
                ELSE 0
              END AS total_centavos
            FROM PedidosPayments
            ORDER BY modified_at ASC;
    batching:
      count: 10000
      period: 20s

pipeline:
  processors:
  - label: processor_generate_meal_order_id
    bloblang: |
      root = this
      root.meal_order_id = "%s%s%s".format(this.id_pedido_refeicao, this.descricao, this.total_centavos)
      root.meal_order_id = root.meal_order_id.hash("md5").encode("hex")

  - label: processor_check_value
    bloblang: |
      root = this
      if this.total_centavos == "0" {
        root.payment_method = "SUBSÍDIO"
      }

  - label: debug_log
    log:
      level: DEBUG
      message: "CURRENT=${! this.modified_at }"

output:
  broker:
    pattern: fan_out
    outputs:
    - label: output
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${OUTPUT_USERNAME}:${OUTPUT_PASSWORD}@tcp(${OUTPUT_CONNHOST}:${OUTPUT_CONNPORT})/${OUTPUT_DATABASE}?${OUTPUT_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS `mealorders` (
            meal_order_id varchar(36) COLLATE utf8mb4_unicode_ci NOT NULL,
            order_id varchar(36) COLLATE utf8mb4_unicode_ci NOT NULL,
            delivery_place varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            name text COLLATE utf8mb4_unicode_ci,
            document varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            item text COLLATE utf8mb4_unicode_ci,
            value int unsigned DEFAULT NULL,
            created_at datetime DEFAULT NULL,
            delivery_date datetime DEFAULT NULL,
            payment_method varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            brand varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            cv varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            payment_status varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            order_status varchar(50) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            modified_at datetime DEFAULT NULL,
            PRIMARY KEY (`meal_order_id`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci
        query:
          INSERT INTO mealorders (
            meal_order_id,
            order_id,
            delivery_place,
            name,
            document,
            item,
            value,
            created_at,
            delivery_date,
            payment_method,
            brand,
            cv,
            payment_status,
            order_status,
            modified_at
          )
          VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
            order_id = VALUES(order_id),
            delivery_place = VALUES(delivery_place),
            name = VALUES(name),
            document = VALUES(document),
            item = VALUES(item),
            value = VALUES(value),
            created_at = VALUES(created_at),
            delivery_date = VALUES(delivery_date),
            payment_method = VALUES(payment_method),
            brand = VALUES(brand),
            cv = VALUES(cv),
            payment_status = VALUES(payment_status),
            order_status = VALUES(order_status),
            modified_at = VALUES(modified_at);
        args_mapping: |
          root = [
            this.meal_order_id,
            this.id_pedido,
            this.delivery_place,
            this.name,
            this.document,
            this.descricao,
            this.total_centavos,
            this.created_at,
            this.delivery_date,
            this.payment_method,
            this.brand,
            this.cv,
            this.payment_status,
            this.order_status,
            this.modified_at
          ]

    - label: output_set_reference_date
      processors:
        - mapping: |
            root = if batch_index() != batch_size() - 1 { deleted() }
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${MAIN_USERNAME}:${MAIN_PASSWORD}@tcp(${MAIN_CONNHOST}:${MAIN_CONNPORT})/benthos?${MAIN_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS datatracker (
            source				    VARCHAR(255)  NOT NULL  PRIMARY KEY,
            reference_date		DATETIME      NOT NULL
          );
        query: |
          INSERT INTO datatracker (source, reference_date)
          VALUES ('meal_orders', ?)
          ON DUPLICATE KEY UPDATE
            reference_date = IF(reference_date < VALUES(reference_date), VALUES(reference_date), reference_date);
        args_mapping: root = [ this.modified_at ]
