logger:
  level: DEBUG

http:
  enabled: true
  root_path: /benthos
  debug_endpoints: true

input:
  label: input
  broker:
    inputs:
      - sql_raw:
          driver: mysql
          conn_max_open: ${MAX_OPEN_CONNECTIONS}
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_or_events?${INPUT_CONNOPTS}
          query: |
            WITH lastReference AS (
              SELECT COALESCE(MAX(d.reference_date), '2001-01-01 00:00:00') AS reference_date
              FROM benthos.datatracker d
              WHERE d.source = 'operation_delays'
            )
            SELECT
              O.id AS operation_id,
              BSR.name AS delay_reason,
              OB.`to` AS delay_start,
              ST.delay_end,
              TIMESTAMPDIFF(SECOND, OB.`to`, ST.delay_end) AS delay_seconds,
              COALESCE(ST.delay_end, OB.`to`) AS reference_date
            FROM shared_api_or_events.operationbookingbehindschedulereasons OBSR
            JOIN shared_api_or_events.operationbookings OB ON OB.id = OBSR.id_operation_booking
            JOIN shared_api_or_events.behindschedulereasons BSR ON BSR.id = OBSR.id_behind_schedule_reason
            JOIN shared_api_or_events.operations O ON O.id_schedule = OB.id_schedule
            LEFT JOIN (
              SELECT
                OBS.id_operation_booking,
                MIN(OBS.created_at) AS delay_end
              FROM shared_api_or_events.operationbookingstatuses OBS
              JOIN shared_api_or_events.entitystatuses ES ON ES.id = OBS.id_entity_status
              WHERE ES.status = 'Em andamento'
              GROUP BY OBS.id_operation_booking
            ) ST ON ST.id_operation_booking = OB.id
            JOIN lastReference lr
            WHERE OB.`to` >= lr.reference_date OR  ST.delay_end >= lr.reference_date
            ORDER BY reference_date;
    batching:
      count: 10000
      period: 20s

pipeline:
  processors:
  - label: processor_generate_table_id
    bloblang: |
      root = this
      root.operation_delay_id = "%s%s%s".format(this.operation_id, this.delay_reason, this.delay_start)
      root.operation_delay_id = root.operation_delay_id.hash("md5").encode("hex")

  - label: debug_log
    log:
      level: DEBUG
      message: "REF=${! this.reference_date }"

output:
  broker:
    pattern: fan_out
    outputs:
    - label: output
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${OUTPUT_USERNAME}:${OUTPUT_PASSWORD}@tcp(${OUTPUT_CONNHOST}:${OUTPUT_CONNPORT})/${OUTPUT_DATABASE}?${OUTPUT_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS operation_delays (
            operation_delay_id    CHAR(36)        NOT NULL  PRIMARY KEY,
            operation_id          CHAR(36)        NOT NULL,
            delay_reason          VARCHAR(100),
            delay_start           DATETIME,
            delay_end             DATETIME,
            delay_seconds         INTEGER            
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE utf8mb4_unicode_ci;
        query: |
          INSERT INTO operation_delays (
            operation_delay_id,
            operation_id,
            delay_reason,
            delay_start,
            delay_end,
            delay_seconds
          ) VALUES(
            ?, ?, ?, ?, ?, ?
          )
          ON DUPLICATE KEY UPDATE
            operation_id = VALUES(operation_id),
            delay_reason = VALUES(delay_reason),
            delay_start = VALUES(delay_start),
            delay_end = VALUES(delay_end),
            delay_seconds = VALUES(delay_seconds);
        args_mapping: |
          root = [
            this.operation_delay_id,
            this.operation_id,
            this.delay_reason,
            this.delay_start,
            this.delay_end,
            this.delay_seconds
          ]

    - label: output_set_reference_date
      processors:
        - mapping: |
            root = if batch_index() != batch_size() - 1 { deleted() }
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${MAIN_USERNAME}:${MAIN_PASSWORD}@tcp(${MAIN_CONNHOST}:${MAIN_CONNPORT})/benthos?${MAIN_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS datatracker (
            source				    VARCHAR(255)  NOT NULL  PRIMARY KEY,
            reference_date		DATETIME      NOT NULL
          );
        query: |
          INSERT INTO datatracker (source, reference_date)
          VALUES ('operation_delays', ?)
          ON DUPLICATE KEY UPDATE reference_date = VALUES(reference_date);
        args_mapping: root = [ this.reference_date ]
