logger:
  level: DEBUG

input:
  label: input_sql
  broker:
    inputs:
      - sql_raw:
          driver: mysql
          dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_reports?${INPUT_CONNOPTS}
          query: |
            WITH UpdatedTransportOrders AS (
              SELECT T.id_order
              FROM shared_api_reports.transportorders T
              WHERE T.updated_at >= (
                SELECT COALESCE(MAX(d.reference_date), '2001-01-01 00:00:00')
                FROM benthos.datatracker d
                WHERE d.source = 'transports_requests_1'
              )
            ),
            UpdatedByStatus AS (
              SELECT DISTINCT OS.order_id
              FROM shared_api_reports.orderstatuses OS
              STRAIGHT_JOIN shared_api_reports.transportorders T
                ON T.id_order = OS.order_id
              WHERE OS.created_at >= (
                SELECT COALESCE(MAX(d.reference_date), '2001-01-01 00:00:00')
                FROM benthos.datatracker d
                WHERE d.source = 'transports_requests_1'
              )
            ),
            UpdatedTransporters AS (
              SELECT DISTINCT OTTO.id_order
              FROM shared_api_reports.orderedtotransportorder OTTO
              STRAIGHT_JOIN shared_api_reports.transportorders T
                ON T.id_order = OTTO.id_order
              WHERE 
                OTTO.created_at >= (
                  SELECT COALESCE(MAX(d.reference_date), '2001-01-01 00:00:00')
                  FROM benthos.datatracker d
                  WHERE d.source = 'transports_requests_1'
                ) 
                OR OTTO.deleted_at >= (
                  SELECT COALESCE(MAX(d.reference_date), '2001-01-01 00:00:00')
                  FROM benthos.datatracker d
                  WHERE d.source = 'transports_requests_1'
                )
            ),
            ImpactedOrders AS (
              SELECT id_order FROM UpdatedTransportOrders
              UNION
              SELECT order_id FROM UpdatedByStatus
              UNION
              SELECT id_order FROM UpdatedTransporters
            ),
            OrderedToAgg AS (
              SELECT
                OTTO.id_order,
                JSON_ARRAYAGG(OTTO.id_ordered_to) AS ordered_to_ids
              FROM ImpactedOrders IO
              JOIN shared_api_reports.orderedtotransportorder OTTO ON OTTO.id_order = IO.id_order
              WHERE OTTO.deleted_at IS NULL
              GROUP BY OTTO.id_order
            )
            SELECT
              T.id_order,
              T.nr_atendimento,
              T.created_at,
              T.updated_at,
              T.origin,
              T.destination,
              T.origin_unit,
              T.destination_unit,
              T.issuer AS issuer_id,
              T.id_ordered_to,
              OTTO.ordered_to_ids,
              OS.order_status_id,
              OS.status_id,
              OS.created_at AS status_created_at,
              OS.created_by,
              P.priority
            FROM shared_api_reports.transportorders T
            JOIN ImpactedOrders IO 
              ON IO.id_order = T.id_order
            LEFT JOIN OrderedToAgg OTTO 
              ON OTTO.id_order = T.id_order
            JOIN shared_api_reports.orderstatuses OS
              ON OS.order_id = T.id_order
            LEFT JOIN shared_api_reports.priorities P
              ON P.id_order = IO.id_order
            ORDER BY OS.created_at ASC;
    batching:
      count: 10000
      period: 20s

pipeline:
  processors:
  - label: processor_create_etl_id
    bloblang: |
      root = this
      root.etl_id = "%s%s".format(this.id_order, this.order_status_id)
      root.etl_id = root.etl_id.hash("md5").encode("hex")

  - label: processor_deduplicate_ordered_to_ids
    bloblang: |
      root = this
      root.ordered_to_ids = this.ordered_to_ids.or("[]").parse_json().unique()

  - label: processor_get_users_info
    branch:
      request_map: root = this
      result_map: |
        let orderedToUsers = this.filter(u -> u.role == "ordered_to")
        let issuerUser = this.filter(u -> u.role == "issuer")
        let changedByUser = this.filter(u -> u.role == "changed_by")

        root.ordered_to = $orderedToUsers.map_each(u -> {
          "id_user": u.id_user,
          "fullname": u.fullname
        })
        root.issuer = if $issuerUser.length() > 0 {
          $issuerUser.0.fullname
        } else {
          null
        }
        root.status_changed_by = if $changedByUser.length() > 0 {
          $changedByUser.0.fullname
        } else {
          null
        }
      processors:
        - sql_raw:
            driver: mysql
            conn_max_open: ${MAX_OPEN_CONNECTIONS}
            dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_users?${INPUT_CONNOPTS}
            query: |
              SELECT u.id_user, u.fullname, 'ordered_to' AS role
              FROM shared_api_users.users u
              JOIN JSON_TABLE(
                ?, '$[*]' COLUMNS (id VARCHAR(36) PATH '$')
              ) jt ON u.id_user = jt.id

              UNION ALL

              SELECT u.id_user, u.fullname, 'issuer' AS role
              FROM shared_api_users.users u
              WHERE u.id_user = ?

              UNION ALL

              SELECT u.id_user, u.fullname, 'changed_by' AS role
              FROM shared_api_users.users u
              WHERE u.id_user = ?
            args_mapping: |
              root = [
                this.ordered_to_ids.string(),
                this.issuer_id,
                this.created_by
              ]

  - label: processor_get_status_name
    branch:
      request_map: root = this
      result_map: |
        root.status = if this.length() > 0 {
          this.0.name
        } else {
          "STATUS NÃO CADASTRADO"
        }
      processors:
        - sql_raw:
            driver: mysql
            conn_max_open: ${MAX_OPEN_CONNECTIONS}
            dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_reports?${INPUT_CONNOPTS}
            query: |
              SELECT
                name
              FROM shared_api_reports.statuses
              WHERE status_id = ?;
            args_mapping: '[ this.status_id ]'

  - label: processor_get_current_status
    branch:
      request_map: root = this
      result_map: |
        root.current_status = if this.length() > 0 {
          1
        } else {
          0
        }
      processors:
        - sql_raw:
            driver: mysql
            conn_max_open: ${MAX_OPEN_CONNECTIONS}
            dsn: ${INPUT_USERNAME}:${INPUT_PASSWORD}@tcp(${INPUT_CONNHOST}:${INPUT_CONNPORT})/shared_api_reports?${INPUT_CONNOPTS}
            query: |
              SELECT
                order_id
              FROM shared_api_reports.orders
              WHERE order_id = ? AND order_status_id = ?;
            args_mapping: '[ this.id_order, this.order_status_id ]'

  - label: debug_log
    log:
      level: DEBUG
      message: "reference=${! this.status_created_at }"


output:
  broker:
    pattern: fan_out
    outputs:
    - label: output_main_data
      sql_raw:
        driver: mysql
        dsn: ${OUTPUT_USERNAME}:${OUTPUT_PASSWORD}@tcp(${OUTPUT_CONNHOST}:${OUTPUT_CONNPORT})/${OUTPUT_DATABASE}?${OUTPUT_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS `transportrequests` (
            `etl_id` varchar(36) COLLATE utf8mb4_unicode_ci NOT NULL,
            `order_id` varchar(36) COLLATE utf8mb4_unicode_ci NOT NULL,
            `created_at` datetime DEFAULT NULL,
            `updated_at` datetime DEFAULT NULL,
            `origin` varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            `destination` varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            `issuer_id` varchar(36) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            `issuer` varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            `ordered_to_ids` json DEFAULT NULL,
            `ordered_to` json DEFAULT NULL,
            `status` varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            `status_date` datetime DEFAULT NULL,
            `status_changed_by` varchar(255) COLLATE utf8mb4_unicode_ci DEFAULT NULL,
            `current_status` tinyint(1) DEFAULT NULL,
            `priority` int DEFAULT NULL,
            PRIMARY KEY (`etl_id`),
            KEY `idx_tr_order_updated` (`order_id`,`updated_at`),
            KEY `idx_tr_updated` (`updated_at`),
            KEY `idx_tr_order_status_date` (`order_id`,`status_date`),
            KEY `idx_tr_current_status_order_id` (`current_status`,`status`,`order_id`)
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
        query: |
          INSERT INTO transportrequests (
            etl_id,
            order_id,
            created_at,
            updated_at,
            origin,
            destination,
            issuer_id,
            issuer,
            ordered_to_ids,
            ordered_to,
            status,
            status_date,
            status_changed_by,
            current_status,
            priority
          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
          ON DUPLICATE KEY UPDATE
            created_at = COALESCE(VALUES(created_at), created_at),
            updated_at = COALESCE(VALUES(updated_at), updated_at),
            origin = COALESCE(VALUES(origin), origin),
            destination = COALESCE(VALUES(destination), destination),
            issuer_id = COALESCE(VALUES(issuer_id), issuer_id),
            issuer = COALESCE(VALUES(issuer), issuer),
            ordered_to_ids = COALESCE(VALUES(ordered_to_ids), ordered_to_ids),
            ordered_to = COALESCE(VALUES(ordered_to), ordered_to),
            status = COALESCE(VALUES(status), status),
            status_date = COALESCE(VALUES(status_date), status_date),
            status_changed_by = COALESCE(VALUES(status_changed_by), status_changed_by),
            current_status = COALESCE(VALUES(current_status), current_status),
            priority = COALESCE(VALUES(priority), priority);
        args_mapping: |
          root = [
            this.etl_id,
            this.id_order,
            this.created_at,
            this.updated_at,
            this.origin,
            this.destination,
            this.issuer_id,
            this.issuer,
            this.ordered_to_ids.string(),
            this.ordered_to.string(),
            this.status,
            this.status_created_at,
            this.status_changed_by,
            this.current_status,
            this.priority
          ]

    - label: output_set_reference_date
      processors:
        - mapping: |
            root = if batch_index() != batch_size() - 1 { deleted() }
      sql_raw:
        driver: mysql
        conn_max_open: ${MAX_OPEN_CONNECTIONS}
        dsn: ${MAIN_USERNAME}:${MAIN_PASSWORD}@tcp(${MAIN_CONNHOST}:${MAIN_CONNPORT})/benthos?${MAIN_CONNOPTS}
        init_statement: |
          CREATE TABLE IF NOT EXISTS datatracker (
            source				    VARCHAR(255)  NOT NULL  PRIMARY KEY,
            reference_date		DATETIME      NOT NULL
          );
        query: |
          INSERT INTO datatracker (source, reference_date)
          VALUES ('transports_requests_1', ?)
          ON DUPLICATE KEY UPDATE reference_date = VALUES(reference_date);
        args_mapping: root = [ this.status_created_at ]
