apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-etl-benthos
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: apps
  source:
    repoURL: https://github.com/hooboxrobotics/infra-v2.git
    targetRevision: main
    path: k8s/manifests/apps/data-etl-benthos
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-data-etl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
