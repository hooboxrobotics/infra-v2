mode: daemonset

image:
  repository: "otel/opentelemetry-collector-contrib"

presets:
  kubernetesAttributes:
    enabled: true
  kubeletMetrics:
    enabled: false

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "256m"
    memory: "1Gi"

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: workload
              operator: In
              values:
                - infra
      - weight: 10
        preference:
          matchExpressions:
            - key: workload
              operator: In
              values:
                - apps

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

service:
  enabled: true
  type: ClusterIP
